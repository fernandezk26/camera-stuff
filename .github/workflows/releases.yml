# Publishes every folder in releases/ as a GitHub release (tag + notes + files), once; files added to a folder later
# are attached to its release.
# A folder may hold COMMIT (a commit SHA) to tag an earlier commit; otherwise the release tags this push.
name: Releases
# Fork: no automatic publishing on push (a first push of this fork's history would publish every upstream release
# folder as a release here). Run it by hand from the Actions tab when a release really should be published.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create missing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for d in releases/v*/; do
            v=$(basename "$d")
            files=$(ls "$d"patch.json "$d"GUIDES.BIN "$d"LABELS.BIN "$d"TONES.BIN "$d"LOOKS.BIN "$d"SHA256SUMS 2>/dev/null || true)
            if gh release view "$v" >/dev/null 2>&1; then
              # already published: only add files that are missing from it (never replaces one)
              have=$(gh release view "$v" --json assets -q '.assets[].name')
              for f in $files; do
                if ! echo "$have" | grep -qx "$(basename "$f")"; then gh release upload "$v" "$f"; echo "$v: added $(basename "$f")"; fi
              done
              continue
            fi
            target=$(cat "$d/COMMIT" 2>/dev/null || echo "$GITHUB_SHA")
            gh release create "$v" --target "$target" --title "Caduceus for OM-3 $v" --notes-file "$d/NOTES.md" $files
            echo "published $v at $target"
          done
